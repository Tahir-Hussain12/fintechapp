<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1a237e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .balance {
            font-size: 30px;
            color: #1a237e;
            font-weight: bold;
        }

        button {
            background: #1a237e;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>FinTech Banking Application</h1>
        <p>Secure • Simple • Digital Banking</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Account Balance</h2>
            <p class="balance">₹1,50,000</p>
        </div>

        <div class="card">
            <h2>Quick Actions</h2>
            <button>Send Money</button>
            <button>Receive Money</button>
            <button>Check Transactions</button>
        </div>

        <div class="card">
            <h2>Recent Transactions</h2>

            <p>✔ Salary Credit - ₹50,000</p>
            <p>✔ Online Shopping - ₹2,500</p>
            <p>✔ Electricity Bill - ₹1,200</p>
            <p>✔ Money Transfer - ₹5,000</p>
        </div>

    </div>

    <footer>
        <p>© 2026 FinTech Application</p>
    </footer>

</body>
</html>
